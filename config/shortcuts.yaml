# Shortcut Sage - Shortcuts Configuration
#
# Action IDs are what the KWin script reports and what rules.yaml refers to.
# Keys are the KDE Plasma 6 defaults. If you changed your shortcuts, run
#   export-shortcuts --sync ~/.config/shortcut-sage/shortcuts.yaml
# to copy your real bindings (from ~/.config/kglobalshortcutsrc) into this file.

version: "1.0"

shortcuts:
  # Desktop Navigation
  - key: "Meta+D"
    action: "show_desktop"
    description: "Peek at desktop"
    category: "desktop"

  - key: "Meta+W"
    action: "overview"
    description: "Toggle Overview"
    category: "desktop"

  - key: "Ctrl+F10"
    action: "present_windows"
    description: "Show all windows (Present Windows)"
    category: "desktop"

  - key: "Ctrl+Meta+Left"
    action: "switch_desktop_prev"
    description: "Switch one desktop to the left"
    category: "desktop"

  - key: "Ctrl+Meta+Right"
    action: "switch_desktop_next"
    description: "Switch one desktop to the right"
    category: "desktop"

  # Window Management
  - key: "Meta+Left"
    action: "tile_left"
    description: "Tile window to the left half"
    category: "window"

  - key: "Meta+Right"
    action: "tile_right"
    description: "Tile window to the right half"
    category: "window"

  - key: "Meta+Up"
    action: "tile_top"
    description: "Tile window to the top half"
    category: "window"

  - key: "Meta+Down"
    action: "tile_bottom"
    description: "Tile window to the bottom half"
    category: "window"

  - key: "Meta+PgUp"
    action: "maximize"
    description: "Maximize window"
    category: "window"

  - key: "Meta+PgDown"
    action: "minimize"
    description: "Minimize window"
    category: "window"

  - key: "Alt+F4"
    action: "close_window"
    description: "Close window"
    category: "window"

  - key: "Alt+F3"
    action: "window_menu"
    description: "Open window menu"
    category: "window"

  - key: "Meta+Ctrl+Shift+Left"
    action: "move_window_left_desktop"
    description: "Move window one desktop to the left"
    category: "window"

  - key: "Meta+Ctrl+Shift+Right"
    action: "move_window_right_desktop"
    description: "Move window one desktop to the right"
    category: "window"

  # Application Launching
  - key: "Meta"
    action: "application_launcher"
    description: "Open application launcher"
    category: "launcher"

  - key: "Alt+Space"
    action: "krunner"
    description: "Open KRunner"
    category: "launcher"

  - key: "Ctrl+Alt+T"
    action: "terminal"
    description: "Open terminal"
    category: "launcher"

  # Screenshots (Spectacle)
  - key: "Shift+Print"
    action: "screenshot_full"
    description: "Screenshot the entire desktop"
    category: "screenshot"

  - key: "Meta+Print"
    action: "screenshot_window"
    description: "Screenshot the active window"
    category: "screenshot"

  - key: "Meta+Shift+Print"
    action: "screenshot_region"
    description: "Screenshot a rectangular region"
    category: "screenshot"
