name: CI

on:
  push:
    branches: [main, master, develop, 'feat/**', 'arena/**']
  pull_request:
    branches: [main, master, develop]

env:
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check sage tests --output-format=github
      - name: Ruff format
        run: ruff format --check sage tests
      - name: Mypy
        run: mypy sage

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # dbus: private session bus for the DBus integration tests (QtDBus needs only
          # libdbus at runtime). The rest are Qt runtime libraries.
          sudo apt-get install -y --no-install-recommends \
            dbus \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libfontconfig1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: KWin script tests (Node)
        run: node --test tests/kwin/main.test.js
      - name: Tests (inside a private DBus session)
        env:
          SHORTCUT_SAGE_REQUIRE_DBUS: '1'
        run: |
          dbus-run-session -- pytest --cov=sage --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
